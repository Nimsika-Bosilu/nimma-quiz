
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.quiz-wrap { padding: 1.5rem 0; max-width: 680px; }
.progress-bar-bg { height: 6px; background: var(--color-background-secondary); border-radius: 99px; margin-bottom: 1.5rem; }
.progress-bar-fill { height: 6px; background: #7F77DD; border-radius: 99px; transition: width 0.4s ease; }
.level-badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; margin-bottom: 0.75rem; letter-spacing: 0.03em; }
.badge-beginner { background: #E1F5EE; color: #0F6E56; }
.badge-intermediate { background: #EEEDFE; color: #3C3489; }
.badge-advanced { background: #FAECE7; color: #712B13; }
.q-num { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 0.5rem; }
.q-text { font-size: 16px; font-weight: 500; color: var(--color-text-primary); line-height: 1.6; margin-bottom: 1.25rem; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
.opt-btn { text-align: left; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 12px 16px; font-size: 14px; color: var(--color-text-primary); cursor: pointer; transition: background 0.15s, border-color 0.15s; line-height: 1.5; }
.opt-btn:hover:not(.disabled) { background: var(--color-background-secondary); border-color: var(--color-border-primary); }
.opt-btn.correct { background: #EAF3DE; border-color: #3B6D11; color: #173404; }
.opt-btn.wrong { background: #FCEBEB; border-color: #A32D2D; color: #501313; }
.opt-btn.reveal { background: #EAF3DE; border-color: #3B6D11; color: #173404; }
.opt-btn.disabled { cursor: default; }
.feedback { font-size: 13px; padding: 10px 14px; border-radius: var(--border-radius-md); margin-bottom: 1.25rem; line-height: 1.6; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: #EAF3DE; color: #27500A; border: 0.5px solid #3B6D11; }
.feedback.wrong { background: #FCEBEB; color: #791F1F; border: 0.5px solid #A32D2D; }
.nav-row { display: flex; gap: 12px; align-items: center; }
.nav-btn { padding: 9px 22px; font-size: 14px; font-weight: 500; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
.nav-btn.primary { background: #7F77DD; border-color: #534AB7; color: #fff; }
.nav-btn:hover { background: var(--color-background-secondary); }
.nav-btn.primary:hover { background: #534AB7; }
.score-wrap { text-align: center; padding: 2rem 1rem; }
.score-big { font-size: 48px; font-weight: 500; color: #7F77DD; }
.score-label { font-size: 15px; color: var(--color-text-secondary); margin-top: 4px; margin-bottom: 1.5rem; }
.score-breakdown { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
.sb-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 20px; min-width: 110px; }
.sb-card .sb-num { font-size: 22px; font-weight: 500; }
.sb-card .sb-lbl { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.sb-beginner .sb-num { color: #0F6E56; }
.sb-intermediate .sb-num { color: #3C3489; }
.sb-advanced .sb-num { color: #712B13; }
</style>

<div class="quiz-wrap">
<h2 class="sr-only">React knowledge MCQ quiz with 15 questions across beginner, intermediate, and advanced levels</h2>

<div class="progress-bar-bg"><div class="progress-bar-fill" id="prog"></div></div>
<div class="q-num" id="qnum"></div>
<span class="level-badge" id="badge"></span>
<div class="q-text" id="qtext"></div>
<div class="options" id="opts"></div>
<div class="feedback" id="fb"></div>
<div class="nav-row">
  <button class="nav-btn primary" id="nextBtn" onclick="handleNext()">Check answer</button>
  <span style="font-size:13px;color:var(--color-text-secondary);" id="scoreTrack"></span>
</div>
<div id="scoreScreen" class="score-wrap" style="display:none;"></div>
</div>

<script>
const questions = [
  {level:"beginner", q:"What does CSS stand for?", opts:["Computer Style Sheets","Cascading Style Sheets","Creative Style System","Colorful Style Sheets"], ans:1, exp:"CSS stands for Cascading Style Sheets — it describes how HTML elements are displayed on screen."},
  {level:"beginner", q:"Which JavaScript keyword is used to declare a variable that cannot be reassigned?", opts:["var","let","const","static"], ans:2, exp:"const declares a block-scoped variable that cannot be reassigned after its initial value is set."},
  {level:"beginner", q:"In HTML, which tag is used to link an external JavaScript file?", opts:["<js>","<link>","<script>","<style>"], ans:2, exp:"The <script> tag with a src attribute is used to include an external JavaScript file in an HTML page."},
  {level:"beginner", q:"What is JSX in React?", opts:["A database query language","A syntax extension that lets you write HTML-like code in JavaScript","A CSS framework used with React","A testing tool for React apps"], ans:1, exp:"JSX is a syntax extension for JavaScript that allows HTML-like markup inside JS files. Babel compiles it to regular JavaScript before the browser runs it."},
  {level:"beginner", q:"Which of the following correctly describes props in React?", opts:["Props are internal state values of a component","Props are CSS styles passed to a component","Props are read-only inputs passed from a parent to a child component","Props are lifecycle methods in React"], ans:2, exp:"Props (short for properties) are read-only data passed from parent to child components, similar to HTML attributes."},
  {level:"intermediate", q:"What is the primary purpose of React's Virtual DOM?", opts:["To replace the browser's HTML engine","To minimise expensive direct DOM manipulations by diffing a lightweight copy first","To store component state between renders","To provide server-side rendering support"], ans:1, exp:"React keeps a Virtual DOM in memory. When state changes, it diffs the new virtual tree against the old one and updates only the changed parts of the real DOM — making updates faster."},
  {level:"intermediate", q:"Which React Hook would you use to run a side effect after every render?", opts:["useState","useRef","useEffect","useContext"], ans:2, exp:"useEffect runs after the component renders. Passing an empty dependency array [] makes it run only once (on mount); omitting the array makes it run after every render."},
  {level:"intermediate", q:"What is prop drilling in React?", opts:["A performance optimisation technique","Passing props through multiple intermediate components just to reach a deeply nested one","A way to attach default values to props","A method for validating prop types"], ans:1, exp:"Prop drilling occurs when you pass props down many layers of components that don't need them, just to reach a deeply nested child. Context or state managers help avoid this."},
  {level:"intermediate", q:"How does React.memo help performance?", opts:["It memoises the return value of a hook","It caches API responses","It prevents a functional component from re-rendering if its props haven't changed","It reduces the bundle size of a React app"], ans:2, exp:"React.memo is a higher-order component that shallow-compares props. If the props are the same as the previous render, the component is skipped and the cached output is reused."},
  {level:"intermediate", q:"In React 18, what changed about state update batching?", opts:["Batching was removed entirely","Batching now applies only inside setTimeout","All state updates are now automatically batched, including those inside setTimeout and fetch callbacks","Batching is opt-in using a new hook"], ans:2, exp:"Before React 18, batching only worked inside React event handlers. React 18 introduced automatic batching everywhere — setTimeout, Promises, and native event handlers — reducing unnecessary re-renders."},
  {level:"advanced", q:"What fundamental problem did React Fiber solve compared to the old stack-based reconciler?", opts:["Fiber added support for class components","Fiber allows rendering to be paused, prioritised, and resumed — the old algorithm had to finish synchronously in one go","Fiber introduced the Virtual DOM concept","Fiber replaced JSX with a new templating syntax"], ans:1, exp:"The old stack-based reconciler was synchronous and couldn't be interrupted. Fiber makes rendering incremental and interruptible, enabling priority-based updates, concurrent rendering, and Suspense."},
  {level:"advanced", q:"What is the key difference between useMemo and useCallback?", opts:["useMemo is for class components; useCallback is for functional components","useMemo caches the result of a function; useCallback caches the function itself","useCallback runs asynchronously; useMemo is synchronous","There is no difference — they are interchangeable"], ans:1, exp:"useMemo(() => compute(a, b), [a, b]) stores the computed value. useCallback(() => fn(a, b), [a, b]) stores the function reference. Both help avoid unnecessary re-renders in child components."},
  {level:"advanced", q:"What is a 'hydration mismatch' in React server-side rendering?", opts:["When the server sends an empty HTML shell","When React cannot find the root DOM node to mount","When the HTML generated on the server differs from what React expects to render on the client","When CSS styles are applied before JavaScript loads"], ans:2, exp:"During hydration, React attaches event listeners to server-rendered HTML. A mismatch error occurs when the server's HTML doesn't match what the client renders — often caused by non-deterministic code like Date.now() or Math.random()."},
  {level:"advanced", q:"What is the purpose of the useImperativeHandle hook in React?", opts:["It prevents a component from re-rendering imperatively","It allows a child component to expose specific methods or values to a parent via a ref","It is used to imperatively update the DOM without using state","It replaces useEffect for DOM manipulations"], ans:1, exp:"Used with forwardRef, useImperativeHandle lets a child component expose a controlled API (e.g. a .focus() method) to its parent through a ref, rather than exposing the entire DOM node."},
  {level:"advanced", q:"What technique do libraries like react-window use to render large lists efficiently?", opts:["Server-side rendering every list item","Lazy loading all list items at once on scroll","Virtualisation — rendering only the items currently visible in the viewport","Storing all list items in a Web Worker"], ans:2, exp:"Virtualisation (or 'windowing') renders only the DOM nodes visible in the user's viewport, plus a small buffer. As the user scrolls, new items are added and off-screen items are removed, keeping the DOM small regardless of list size."},
];

let current = 0, score = 0, answered = false;
let perLevel = {beginner:0, intermediate:0, advanced:0};
let totalPerLevel = {beginner:5, intermediate:5, advanced:5};

function render() {
  const q = questions[current];
  document.getElementById('prog').style.width = ((current/15)*100)+'%';
  document.getElementById('qnum').textContent = 'Question '+(current+1)+' of 15';
  const badge = document.getElementById('badge');
  badge.textContent = q.level.charAt(0).toUpperCase()+q.level.slice(1);
  badge.className = 'level-badge badge-'+q.level;
  document.getElementById('qtext').textContent = q.q;
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.opts.forEach((o,i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = String.fromCharCode(65+i)+'. '+o;
    b.onclick = () => selectOpt(i, b);
    opts.appendChild(b);
  });
  document.getElementById('fb').className = 'feedback';
  document.getElementById('fb').textContent = '';
  document.getElementById('nextBtn').textContent = 'Check answer';
  document.getElementById('scoreTrack').textContent = 'Score: '+score+'/'+(current);
  answered = false;
}

function selectOpt(i, btn) {
  if(answered) return;
  answered = true;
  const q = questions[current];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.classList.add('disabled'));
  const fb = document.getElementById('fb');
  if(i === q.ans) {
    btn.classList.add('correct');
    score++;
    perLevel[q.level]++;
    fb.textContent = '✓ Correct! '+q.exp;
    fb.className = 'feedback correct show';
  } else {
    btn.classList.add('wrong');
    allBtns[q.ans].classList.add('reveal');
    fb.textContent = '✗ Not quite. '+q.exp;
    fb.className = 'feedback wrong show';
  }
  document.getElementById('nextBtn').textContent = current < 14 ? 'Next question →' : 'See results';
  document.getElementById('scoreTrack').textContent = 'Score: '+score+'/'+(current+1);
}

function handleNext() {
  if(!answered) return;
  current++;
  if(current >= 15) { showScore(); return; }
  render();
}

function showScore() {
  document.getElementById('prog').style.width = '100%';
  document.getElementById('qnum').textContent = '';
  document.getElementById('badge').textContent = '';
  document.getElementById('qtext').textContent = '';
  document.getElementById('opts').innerHTML = '';
  document.getElementById('fb').className = 'feedback';
  document.getElementById('navRow') && (document.getElementById('navRow').style.display = 'none');
  document.querySelector('.nav-row').style.display = 'none';

  const pct = Math.round((score/15)*100);
  let msg = pct >= 80 ? 'Excellent work! 🎉' : pct >= 60 ? 'Good effort! Keep practicing.' : 'Keep learning — you\'ll get there!';
  document.getElementById('scoreScreen').style.display = 'block';
  document.getElementById('scoreScreen').innerHTML = `
    <div class="score-big">${score}/15</div>
    <div class="score-label">${pct}% — ${msg}</div>
    <div class="score-breakdown">
      <div class="sb-card sb-beginner"><div class="sb-num">${perLevel.beginner}/5</div><div class="sb-lbl">Beginner</div></div>
      <div class="sb-card sb-intermediate"><div class="sb-num">${perLevel.intermediate}/5</div><div class="sb-lbl">Intermediate</div></div>
      <div class="sb-card sb-advanced"><div class="sb-num">${perLevel.advanced}/5</div><div class="sb-lbl">Advanced</div></div>
    </div>
    <button class="nav-btn primary" onclick="restart()">Retake quiz</button>
  `;
}

function restart() {
  current = 0; score = 0; answered = false;
  perLevel = {beginner:0, intermediate:0, advanced:0};
  document.getElementById('scoreScreen').style.display = 'none';
  document.querySelector('.nav-row').style.display = 'flex';
  render();
}

render();
</script>
